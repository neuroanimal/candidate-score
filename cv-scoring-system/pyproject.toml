[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cvscore"
version = "0.1.0"
description = "Explainable CV / cover letter / job offer scoring (PL/EN) without LLMs"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pymupdf==2.0",
    "pdfplumber==0.11.10",
    "pytesseract==0.3.13",
    "pillow==13.0.0",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "rank-bm25==0.2.2",
    "rapidfuzz==3.14.6",
    "PyYAML==6.0.3",
    "Jinja2==3.1.6",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]
dev = ["pytest==9.2.0", "pylint==4.1.3"]

[project.scripts]
cvscore = "cvscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvscore = ["data/*.yaml", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
